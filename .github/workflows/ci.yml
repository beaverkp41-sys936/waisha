name: ci
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the "packageManager" field in package.json — single source of truth

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Security scan (SQL injection, eval, child_process)
        run: pnpm --filter @waisha/api scan

      - name: Build API
        run: pnpm --filter @waisha/api build

      - name: Build Web
        run: pnpm --filter @waisha/web build